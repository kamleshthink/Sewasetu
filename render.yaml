services:
  - type: web
    name: sewasetu-portal
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sewasetu-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: sewasetu-db
    databaseName: sewasetu
    user: sewasetu
    plan: free
    region: singapore
